name: Quality and Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: quality-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test -- --runInBand
      - name: Build application
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

  accessibility:
    name: Accessibility browser gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Build production static site
        run: npm run build
      - name: Serve exported site
        id: serve
        run: |
          python3 -m http.server 3100 --bind 127.0.0.1 --directory out > accessibility-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat accessibility-server.log
          exit 1
      - name: Run EN/UA route and interaction accessibility checks
        run: npm run test:a11y
      - name: Capture Lighthouse trends
        if: always() && steps.serve.outcome == 'success'
        run: |
          mkdir -p accessibility-reports
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npx lighthouse 'http://127.0.0.1:3100/?lang=en' --only-categories=accessibility --output=json --output-path=accessibility-reports/lighthouse-home-en.json --chrome-flags='--headless --no-sandbox' --quiet
          npx lighthouse 'http://127.0.0.1:3100/?lang=uk' --only-categories=accessibility --output=json --output-path=accessibility-reports/lighthouse-home-uk.json --chrome-flags='--headless --no-sandbox' --quiet
      - name: Upload accessibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: accessibility-reports
          path: |
            test-results/
            accessibility-reports/
            accessibility-server.log
          if-no-files-found: warn
          retention-days: 30

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Block newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze source code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect verified or uncertain secrets
        uses: trufflesecurity/trufflehog@v3.97.5
        with:
          version: 3.97.5
          extra_args: --results=verified,unknown

  trivy:
    name: SCA, secrets, and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
      - name: Upload Trivy results to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
      - name: Enforce high and critical Trivy findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true
      - name: Capture current npm audit baseline
        if: always()
        run: npm audit --json > npm-audit.json || true
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: |
            trivy-results.sarif
            npm-audit.json
          retention-days: 30

  dast:
    name: OWASP ZAP baseline DAST
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Serve exported site
        run: |
          python3 -m http.server 3000 --directory out > application.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat application.log
          exit 1
      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm --network host \
            --volume "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000/ \
            -a -I \
            -r zap-report.html \
            -J zap-report.json
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zap-baseline-report
          path: |
            zap-report.html
            zap-report.json
            application.log
          retention-days: 30
