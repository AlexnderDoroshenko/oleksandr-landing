name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy public site
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Exclude server-only admin page from static export
        run: |
          mkdir -p /tmp/oleksandr-landing-server-pages
          mv pages/admin/new-post.tsx /tmp/oleksandr-landing-server-pages/new-post.tsx

      - name: Build static public site
        env:
          GITHUB_PAGES: 'true'
          NEXTAUTH_SECRET: github-pages-static-build
          NODE_ENV: production
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
